<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Medio Ambiente | Eidan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d0f0e;
            color: #e8e8e8;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* === FONDO DINÁMICO CON CSS === */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 40%, #1a2e1f, #0a0f0b);
        }

        /* Partículas flotantes (CSS puro) */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(76, 175, 80, 0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Grid de fondo sutil */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(76, 175, 80, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(76, 175, 80, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Contenedor principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        /* Grid responsivo */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        /* === ESTILOS DEL CONTENIDO === */
        .overline {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(200, 240, 180, 0.7);
            margin-bottom: 2rem;
            border-left: 2px solid #4caf50;
            padding-left: 1rem;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .accent {
            color: #6ccf6a;
            font-weight: 500;
            position: relative;
            display: inline-block;
        }

        .accent::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #6ccf6a, transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        h1:hover .accent::after {
            transform: scaleX(1);
        }

        .description {
            font-size: 0.95rem;
            color: rgba(220, 220, 220, 0.7);
            margin-bottom: 2rem;
            line-height: 1.7;
            font-weight: 300;
            max-width: 90%;
        }

        /* Línea divisora minimal */
        .divider {
            width: 40px;
            height: 1px;
            background: rgba(108, 207, 106, 0.4);
            margin: 1.5rem 0;
        }

        /* Acciones minimalistas */
        .actions {
            list-style: none;
            margin-bottom: 2rem;
        }

        .actions li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.85rem;
            font-weight: 300;
            color: rgba(230, 230, 230, 0.8);
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .actions li:hover {
            color: #6ccf6a;
            transform: translateX(4px);
        }

        .dot {
            width: 4px;
            height: 4px;
            background: #6ccf6a;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .actions li:hover .dot {
            width: 6px;
            height: 6px;
            background: #8fdf8d;
            box-shadow: 0 0 6px rgba(108, 207, 106, 0.5);
        }

        /* Autor minimal */
        .author {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.75rem;
            color: rgba(200, 200, 200, 0.5);
            letter-spacing: 1px;
        }

        .author strong {
            color: #6ccf6a;
            font-weight: 400;
            background: rgba(108, 207, 106, 0.08);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        /* === IMAGEN QUE RESALTA (EFECTO GLASS + BRILLO) === */
        .image-frame {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Efecto de brillo exterior */
        .glow-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            max-width: 460px;
            max-height: 460px;
            border-radius: 28px;
            background: radial-gradient(circle, rgba(108,207,106,0.2) 0%, rgba(108,207,106,0) 70%);
            filter: blur(20px);
            transition: opacity 0.5s ease;
            opacity: 0.6;
            z-index: 0;
        }

        .image-wrapper {
            position: relative;
            z-index: 2;
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 
                0 20px 40px -12px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(108, 207, 106, 0.15);
        }

        .image-wrapper img {
            width: 100%;
            max-width: 460px;
            height: auto;
            display: block;
            border-radius: 28px;
            transition: transform 0.7s ease, filter 0.5s ease;
            filter: brightness(1.02) contrast(1.05) saturate(1.1);
            backdrop-filter: blur(0px);
        }

        /* Hover en imagen: zoom + brillo intenso */
        .image-frame:hover .glow-ring {
            opacity: 1;
            filter: blur(30px);
            background: radial-gradient(circle, rgba(108,207,106,0.35) 0%, rgba(108,207,106,0) 70%);
        }

        .image-frame:hover .image-wrapper {
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1.5px rgba(108, 207, 106, 0.4);
        }

        .image-frame:hover .image-wrapper img {
            transform: scale(1.02);
            filter: brightness(1.05) contrast(1.08) saturate(1.15);
        }

        /* Sutil glass overlay */
        .glass-touch {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, rgba(108,207,106,0.02) 100%);
            border-radius: 28px;
            pointer-events: none;
            z-index: 3;
        }

        /* === MICRO-INTERACCIONES JS === */
        .focus-hint {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            font-size: 0.65rem;
            color: rgba(200,200,200,0.3);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            z-index: 100;
            transition: opacity 0.3s;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                padding: 2rem 1.5rem;
            }
            .grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
            .content {
                text-align: center;
            }
            .overline {
                margin-left: auto;
                margin-right: auto;
                border-left: none;
                border-bottom: 2px solid #4caf50;
                padding-left: 0;
                padding-bottom: 0.5rem;
            }
            .description {
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
            .divider {
                margin-left: auto;
                margin-right: auto;
            }
            .actions li {
                justify-content: center;
            }
            .author {
                justify-content: center;
            }
            .image-frame {
                order: -1;
            }
            .image-wrapper img {
                max-width: 320px;
            }
            .glow-ring {
                max-width: 320px;
                max-height: 320px;
            }
            .focus-hint {
                display: none;
            }
        }

        /* Fade-in elegante */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.35s; }
        .delay-400 { animation-delay: 0.5s; }
    </style>
</head>

<body>

    <!-- Fondo dinámico CSS -->
    <div class="bg-gradient"></div>
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <main class="container">
        <div class="grid">
            
            <!-- Columna izquierda - contenido -->
            <div class="content fade-in">
                <div class="overline">EN ARMONÍA</div>
                
                <h1>
                    donde <span class="accent">la tierra</span><br>
                    respira libre
                </h1>
                
                <p class="description">
                    Lo pequeño es profundo. Reducir, restaurar, respetar. 
                    No necesitas grandes gestos, solo decisiones conscientes.
                </p>
                
                <div class="divider"></div>
                
                <ul class="actions">
                    <li><span class="dot"></span> Consume menos, vive más</li>
                    <li><span class="dot"></span> Protege el agua</li>
                    <li><span class="dot"></span> Planta futuro</li>
                    <li><span class="dot"></span> Elige movilidad limpia</li>
                </ul>
                
                <div class="author">
                    <span>✦</span>
                    <span>Presentado por</span>
                    <strong>Eidan</strong>
                </div>
            </div>
            
            <!-- Columna derecha - imagen que resalta -->
            <div class="image-frame fade-in delay-200">
                <div class="glow-ring"></div>
                <div class="image-wrapper">
                    <img src="MedioAmbiente.png" alt="Medio Ambiente - conexión natural">
                    <div class="glass-touch"></div>
                </div>
            </div>
            
        </div>
    </main>

    <div class="focus-hint" id="focusHint">
        ⚡ respira · conecta
    </div>

    <script>
        (function() {
            // === 1. PARTÍCULAS DINÁMICAS CON JS ===
            const particlesContainer = document.getElementById('particles');
            const particleCount = 35;
            
            function createParticle() {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.opacity = Math.random() * 0.4 + 0.1;
                particle.style.animationDuration = Math.random() * 12 + 8 + 's';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.background = `rgba(108, 207, 106, ${Math.random() * 0.2 + 0.05})`;
                particlesContainer.appendChild(particle);
                
                // Remover después de la animación para no acumular
                particle.addEventListener('animationend', () => {
                    particle.remove();
                    createParticle(); // regenerar
                });
            }
            
            for(let i = 0; i < particleCount; i++) {
                setTimeout(() => createParticle(), i * 200);
            }
            
            // === 2. EFECTO DE BRILLO SEGUIDOR DE MOUSE EN LA IMAGEN ===
            const imageFrame = document.querySelector('.image-frame');
            const glowRing = document.querySelector('.glow-ring');
            
            if(imageFrame && glowRing) {
                imageFrame.addEventListener('mousemove', (e) => {
                    const rect = imageFrame.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    glowRing.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(108,207,106,0.4) 0%, rgba(108,207,106,0) 70%)`;
                });
                
                imageFrame.addEventListener('mouseleave', () => {
                    glowRing.style.background = `radial-gradient(circle, rgba(108,207,106,0.2) 0%, rgba(108,207,106,0) 70%)`;
                });
            }
            
            // === 3. INTERACCIÓN CON LAS ACCIONES (efecto sutil de mensaje) ===
            const actionItems = document.querySelectorAll('.actions li');
            const messages = [
                '🌱 Reduce tu huella',
                '💧 Cada gota cuenta',
                '🌳 Un árbol cambia todo',
                '🚲 Elige verde'
            ];
            
            actionItems.forEach((item, index) => {
                item.addEventListener('click', () => {
                    const msg = messages[index % messages.length];
                    const hint = document.getElementById('focusHint');
                    const originalText = hint.innerText;
                    hint.style.opacity = '1';
                    hint.style.color = 'rgba(108, 207, 106, 0.8)';
                    hint.innerText = `✦ ${msg} ✦`;
                    setTimeout(() => {
                        hint.style.color = 'rgba(200,200,200,0.3)';
                        hint.innerText = originalText;
                    }, 1500);
                });
            });
            
            // === 4. EFECTO DE APARICIÓN SUTIL CON SCROLL ===
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if(entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                    }
                });
            }, { threshold: 0.2 });
            
            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
            
            // === 5. RELOJ BIÓFILO: mensaje dinámico cada 20s ===
            let messagesCycle = [
                "🍃 respira profundo",
                "🌿 cuida lo que amas",
                "💚 pequeño gesto, gran cambio",
                "🌎 la naturaleza te espera"
            ];
            let idx = 0;
            setInterval(() => {
                const hint = document.getElementById('focusHint');
                if(hint && hint.innerText.includes('respira')) {
                    hint.style.opacity = '0.7';
                    hint.innerText = `✦ ${messagesCycle[idx % messagesCycle.length]} ✦`;
                    setTimeout(() => {
                        if(hint.innerText.includes(messagesCycle[idx % messagesCycle.length])) {
                            hint.innerText = '⚡ respira · conecta';
                            hint.style.opacity = '0.5';
                        }
                    }, 2800);
                    idx++;
                }
            }, 18000);
            
        })();
    </script>
</body>

</html>
